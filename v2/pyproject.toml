[project]
name = "cv-melvin"
version = "1.0.0"
description = "Cockpit personnel de candidature et générateur de CV personnalisé"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-SQLAlchemy>=3.1,<4",
  "Pillow>=11,<12",
  "playwright>=1.55,<2",
  "pypdf>=6,<7",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
