{% extends "base.html" %}{% block title %}Nouvelle candidature{% endblock %}{% block content %}<div class="heading"><div><p class="eye">Nouveau dossier</p><h1>Nouvelle candidature</h1><p>Collez l’offre et ajoutez le logo fourni par l’entreprise.</p></div></div><form class="panel form" method="post" enctype="multipart/form-data"><label>Entreprise<input name="company" required value="{{ request.form.get('company','') }}"></label><label>Intitulé du poste<input name="job_title" required value="{{ request.form.get('job_title','') }}"></label><label class="full">URL de l’offre<input type="url" name="offer_url" value="{{ request.form.get('offer_url','') }}" placeholder="Facultatif"></label><label class="full">Texte de l’offre<textarea name="offer_text" rows="16" minlength="80" required>{{ request.form.get('offer_text','') }}</textarea></label><label class="full upload">Logo de l’entreprise<input type="file" name="logo" accept="image/png,image/jpeg,image/webp" required><small>PNG, JPEG ou WebP · 8 Mo maximum · jamais récupéré automatiquement</small></label><div class="full actions"><a href="{{ url_for('web.dashboard') }}">Annuler</a><button class="btn">Analyser cette opportunité</button></div></form>{% endblock %}
